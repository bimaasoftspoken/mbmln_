<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about bimaaa</title>
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS UTAMA & RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: #000; color: #fff; min-height: 100vh; position: relative; overflow-x: hidden; padding-bottom: 80px; }
        
        /* --- REAL MILKY WAY BACKGROUND --- */
        .stars-background { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; 
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .stars-background::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); }

        .star { position: absolute; border-radius: 50%; animation: twinkle infinite alternate; box-shadow: 0 0 8px currentColor; z-index: 1; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes floatStar { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-100vh) rotate(360deg); } }
        .star.floating { animation: floatStar linear infinite; }

        /* --- NAVIGATION BAWAH (FIXED BOTTOM) --- */
        .tab-navigation { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(5, 5, 15, 0.8); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); 
            z-index: 9999; display: flex; justify-content: center; gap: 10px; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); font-family: 'Poppins', sans-serif; 
        }
        .tab-btn { background: transparent; border: 1px solid transparent; color: #ccc; padding: 8px 20px; border-radius: 25px; cursor: pointer; font-weight: 500; transition: all 0.3s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .tab-btn.active { background: rgba(255,255,255,0.95); color: #000; font-weight: 600; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .tab-btn iconify-icon { font-size: 1.2rem; }

        /* --- SECTIONS --- */
        .section { display: none; max-width: 100%; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; opacity: 0; transform: translateY(20px); transition: all 0.4s ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* --- HOME (DIPERBAIKI) --- */
        .home-content { text-align: center; max-width: 800px; margin: 0 auto; padding-top: 0; font-family: 'Poppins', sans-serif; }
        .home-content h1 { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(45deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        .home-content p.subtitle { color: #ddd; margin-bottom: 40px; font-size: 1.1rem; }
        .feature-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .feature-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 20px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; word-break: break-word; }
        .feature-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .feature-card iconify-icon { font-size: 3.5rem; color: #a78bfa; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.4)); }
        .feature-card h3 { font-size: 1.2rem; margin-bottom: 10px; font-weight: 600; }
        .feature-card p { color: #ccc; font-size: 0.9rem; line-height: 1.5; }

        /* --- MUSIC PLAYER --- */
        .music-content { max-width: 360px; margin: 0 auto; font-family: 'Poppins', sans-serif; }
        .player-wrapper { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 25px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .album-cover { width: 170px; height: 170px; margin: 0 auto 20px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .song-info { text-align: center; margin-bottom: 20px; }
        .song-info h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { color: #ccc; font-size: 0.85rem; margin: 0; }
        .progress-container { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .time { color: #ccc; font-size: 0.75rem; font-variant-numeric: tabular-nums; width: 35px; text-align: center; }
        .progress-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; position: relative; }
        .progress { height: 100%; background: #a78bfa; border-radius: 3px; width: 0%; position: relative; transition: width 0.1s linear; }
        .progress::after { content: ''; position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.2s; }
        .progress-bar:hover .progress::after { opacity: 1; }
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px; }
        .control-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 1.8rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; opacity: 0.8; }
        .control-btn:hover { opacity: 1; transform: scale(1.1); }
        .control-btn.play-btn { width: 55px; height: 55px; background: #fff; color: #000; border-radius: 50%; font-size: 2rem; opacity: 1; box-shadow: 0 8px 15px rgba(255,255,255,0.2); }
        .control-btn.play-btn:hover { transform: scale(1.05); }
        .lyrics-display { margin-top: 20px; height: 90px; background: rgba(0,0,0,0.5); border-radius: 12px; padding: 10px 15px; text-align: center; display: flex; flex-direction: column; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .lyrics-wrapper { transition: opacity 0.3s ease, transform 0.3s ease; font-size: 0.85rem; line-height: 1.4; }
.lyric-line { font-size: 0.85rem; color: #fff; font-weight: 500; line-height: 1.4; text-shadow: 0 1px 5px rgba(0,0,0,0.8); }
.lyric-line.translated { font-size: 0.75rem; color: #ccc; font-style: italic; margin-top: 2px; font-weight: 400; }

        /* =========================================
           IG GALLERY CLONE
           ========================================= */
        .gallery-content { max-width: 380px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .ig-post { background: #000; border: 1px solid #262626; border-radius: 12px; padding-bottom: 15px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        .ig-post-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; }
        .ig-user-wrap { display: flex; align-items: center; gap: 10px; }
        .ig-avatar-ring { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; display: flex; justify-content: center; align-items: center; }
        .ig-avatar-ring img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
        
        .ig-name-loc { display: flex; flex-direction: column; line-height: 1.2; justify-content: center; }
        .ig-name-row { display: flex; align-items: center; gap: 4px; }
        .ig-username { font-weight: 600; font-size: 14px; color: #f5f5f5; }
        .ig-verified { color: #0095f6; font-size: 14px; }
        .ig-location { font-size: 12px; color: #a8a8a8; margin-top: 2px; font-weight: 400; }
        .ig-dots { font-size: 20px; color: #f5f5f5; cursor: pointer; }

        .ig-media { position: relative; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: pointer; }
        .ig-media img, .ig-media video { width: 100%; height: auto; max-height: 550px; display: block; object-fit: cover; }
        
        .mute-indicator { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); border-radius: 50%; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 10; }
        .mute-indicator.show { opacity: 1; }

        .double-tap-heart { position: absolute; font-size: 100px; color: #ff3040; opacity: 0; transform: scale(0); filter: drop-shadow(0 0 20px rgba(255,48,64,0.6)); pointer-events: none; z-index: 5; }
        .double-tap-heart.animate { animation: popHeart 1s ease-out forwards; }
        @keyframes popHeart { 0% { opacity: 0; transform: scale(0) rotate(-15deg); } 15% { opacity: 1; transform: scale(1.2) rotate(0deg); } 30% { transform: scale(1) rotate(0deg); } 80% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(1.5) translateY(-20px); } }

        .ig-actions { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 6px 14px; }
        .ig-actions-left { display: flex; gap: 14px; align-items: center; } 
        
        .ig-action-item { display: flex; align-items: center; gap: 4px; cursor: pointer; transition: transform 0.1s; }
        .ig-action-item:active { transform: scale(0.95); }
        .ig-icon { font-size: 22px; color: #f5f5f5; } 
        .ig-count { font-size: 13px; font-weight: 600; color: #f5f5f5; line-height: 1; } 
        
        .ig-icon.liked { color: #ff3040 !important; animation: heartBeat 0.3s ease-in-out; }
        @keyframes heartBeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .ig-caption-container { padding: 0 14px; margin-bottom: 4px; }
        .ig-caption { font-size: 13px; line-height: 1.4; color: #f5f5f5; }
        .ig-caption strong { font-weight: 600; margin-right: 4px; }
        
        .ig-translate-btn { font-size: 12px; color: #f5f5f5; font-weight: 600; padding: 0 14px; cursor: pointer; margin-bottom: 6px; display: inline-block; }
        .ig-time { font-size: 11px; color: #a8a8a8; padding: 0 14px; margin-top: 4px; }

        /* --- SMOOTH GAME CSS --- */
        .game-content { max-width: 600px; margin: 0 auto; text-align: center; font-family: 'Poppins', sans-serif; }
        .score-display { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .score-card { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; padding: 15px 30px; min-width: 150px; backdrop-filter: blur(10px); }
        .score-card h4 { color: #ccc; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .score-number { font-size: 2.5rem; font-weight: 700; color: #fff; line-height: 1; }
        
        .game-area { width: 100%; height: 400px; background: rgba(0,0,0,0.5); border: 2px dashed rgba(255,255,255,0.3); border-radius: 20px; position: relative; overflow: hidden; margin-bottom: 20px; cursor: crosshair; touch-action: none; backdrop-filter: blur(5px); }
        .player-box { position: absolute; width: 45px; height: 45px; background: linear-gradient(135deg, #60a5fa, #3b82f6); border-radius: 10px; z-index: 10; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); will-change: transform; top: 0; left: 0; }
        .enemy { position: absolute; width: 35px; height: 35px; background: linear-gradient(135deg, #f87171, #ef4444); border-radius: 8px; z-index: 5; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); will-change: transform; top: 0; left: 0; }
        
        .confetti { position: absolute; width: 8px; height: 8px; z-index: 100; pointer-events: none; border-radius: 2px; }

        .game-controls { display: flex; justify-content: center; gap: 15px; }
        .game-btn { padding: 12px 25px; border-radius: 25px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 1rem; }
        .start-btn { background: #fff; color: #000; }
        .start-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,255,255,0.3); }
        .pause-btn, .reset-btn { background: rgba(255,255,255,0.2); color: #fff; }
        .pause-btn:hover:not(:disabled), .reset-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
        .game-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Media Query Khusus Layar Kecil (HP) */
        @media (max-width: 480px) {
            .tab-btn span { display: none; }
            .tab-btn { padding: 10px; border-radius: 50%; }
            .feature-cards { grid-template-columns: 1fr; }
            .game-area { height: 300px; }
            .ig-actions { padding: 8px 12px 6px 12px; }
            .ig-actions-left { gap: 10px; } 
            .ig-icon { font-size: 19px; } 
            .ig-count { font-size: 12px; } 
            .ig-caption-container, .ig-translate-btn, .ig-time { padding-left: 12px; padding-right: 12px; }
        }
    </style>
</head>
<body>
    <div class="stars-background" id="starsContainer"></div>

    <section class="section active" id="home-section">
        <div class="home-content">
            <h1>Thank you <br> for  visiting</h1>
            <p class="subtitle">Welcome to the other side bima</p>
            <div class="feature-cards">
                <div class="feature-card">
                  
                    <h3>valentine 2026</h3>
                    <p>https://bimaasoftspoken.github.io/bima/<br>pw: 1402</p>
                </div>
                <div class="feature-card">
                    
                    <h3>birthday</h3>
                    <p>coming soon</p>
                </div>
                <div class="feature-card">
                    
                    <h3>mls mikir</h3>
                    <p></p>
                </div>
            </div>
        </div>
    </section>

    <section class="section" id="music-section">
        <div class="music-content">
            <audio id="realAudioPlayer" preload="metadata"></audio>
            <div class="player-wrapper">
                <div class="now-playing">
                    <div class="album-cover"><img id="coverImage" src="" alt="Cover"></div>
                    <div class="song-info"><h3 id="songTitle">Title</h3><p id="songArtist">Artist</p></div>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar" onclick="seekSong(event)"><div class="progress" id="progressFill"></div></div>
                    <span class="time" id="totalDuration">0:00</span>
                </div>
                <div class="player-controls">
                    <button class="control-btn" onclick="prevSong()"><iconify-icon icon="mdi:skip-previous"></iconify-icon></button>
                    <button class="control-btn play-btn" id="playBtn" onclick="togglePlay()"><iconify-icon icon="mdi:play" id="playIcon"></iconify-icon></button>
                    <button class="control-btn" onclick="nextSong()"><iconify-icon icon="mdi:skip-next"></iconify-icon></button>
                </div>
                <div class="lyrics-display">
                    <div id="currentLyric" class="lyrics-wrapper"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="section" id="gallery-section">
        <div class="gallery-content" id="galleryFeed"></div>
    </section>

    <section class="section" id="game-section">
        <div class="game-content">
            <div class="score-display">
                <div class="score-card"><h4>Score</h4><div class="score-number" id="gameScore">0</div></div>
                <div class="score-card"><h4>Best</h4><div class="score-number" id="highScore">0</div></div>
            </div>
            <p style="color: #ccc; margin-bottom: 10px; font-size: 0.9rem;">Dapatkan skor dengan melewati kotak merah!</p>
            <div class="game-area" id="gameArea" onmousemove="movePlayer(event)" ontouchmove="movePlayerTouch(event)">
                <div class="player-box" id="player"></div>
            </div>
            <div class="game-controls">
                <button class="game-btn start-btn" id="startBtn" onclick="startGame()">Start</button>
                <button class="game-btn pause-btn" id="pauseBtn" onclick="pauseGame()" disabled>Pause</button>
                <button class="game-btn reset-btn" onclick="resetGame()">Reset</button>
            </div>
        </div>
    </section>

    <div class="tab-navigation">
        <button class="tab-btn active" onclick="openTab('home')"><iconify-icon icon="mdi:home-variant"></iconify-icon><span>Home</span></button>
        <button class="tab-btn" onclick="openTab('music')"><iconify-icon icon="mdi:music-circle"></iconify-icon><span>Music</span></button>
        <button class="tab-btn" onclick="openTab('gallery')"><iconify-icon icon="mdi:instagram"></iconify-icon><span>Gallery</span></button>
        <button class="tab-btn" onclick="openTab('game')"><iconify-icon icon="mdi:controller"></iconify-icon><span>Game</span></button>
    </div>

    <script>
        // --- FOREGROUND STARS GENERATOR ---
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starColors = ['#ffffff', '#ffffff', '#e2e8f0', '#93c5fd', '#fbcfe8'];
            for(let i=0; i<80; i++) {
                let star = document.createElement('div');
                star.className = 'star floating';
                let size = Math.random() < 0.8 ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
                star.style.width = size + 'px'; star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
                star.style.color = starColors[Math.floor(Math.random() * starColors.length)];
                star.style.animationDuration = (Math.random() * 3 + 2) + 's, ' + (Math.random() * 20 + 20) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        // --- TAB NAVIGATION ---
        function openTab(tabName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            setTimeout(() => { document.getElementById(tabName + '-section').classList.add('active'); }, 50);
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.getAttribute('onclick').includes(tabName)) btn.classList.add('active');
            });
            window.scrollTo(0,0);
        }

        // ==========================================
        // DATA GALLERY INSTAGRAM 
        // ==========================================
        const igPosts = [
                      {
                type: "video", 
                avatar: "k.jpg",
                username: "keluarga gajelas ✌🏻",
                verified: true,
                location: "",
                mediaSrc: "keluargagajelas.mp4", 
                likes: "1,2JT",
                comments: "50.112",
                reposts: "88.300",
                shares: "200rb",
                captionOriginal: "",
                captionTranslated: "ngapain lihat terjemahan",
                time: "5 Maret 2026"
            },
            {
                type: "video", 
                avatar: "f.jpg", 
                username: "fourever ✌🏻",
                verified: true, 
                location: "",
                mediaSrc: "fourever.mp4",
                likes: "24,5JT",
                comments: "8,402",
                reposts: "10,326rb",
                shares: "10rb",
                captionOriginal: "",
                captionTranslated: "gatau bingung",
                time: "10 Maret 2026"
            }

        ];

        // --- OBSERVER UNTUK AUTO-PLAY VIDEO ---
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target;
                if(entry.isIntersecting) {
                    video.play().catch(e => console.log("Browser menahan Autoplay."));
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.5 }); 

        // --- FUNGSI RENDER HTML GALLERY DARI JS ---
        function renderGallery() {
            const container = document.getElementById('galleryFeed');
            container.innerHTML = ''; 
            
            igPosts.forEach((post, index) => {
                let mediaHTML = '';
                
                if (post.type === 'video') {
                    mediaHTML = `
                    <div class="ig-media video-media">
                        <video src="${post.mediaSrc}" autoplay muted loop playsinline></video>
                        <iconify-icon icon="ph:heart-fill" class="double-tap-heart"></iconify-icon>
                        <div class="mute-indicator"><iconify-icon icon="ph:speaker-x"></iconify-icon></div>
                    </div>`;
                } else {
                    mediaHTML = `
                    <div class="ig-media image-media" ondblclick="triggerDoubleTapLike(this)">
                        <img src="${post.mediaSrc}" alt="Post">
                        <iconify-icon icon="ph:heart-fill" class="double-tap-heart"></iconify-icon>
                    </div>`;
                }

                const verifiedHTML = post.verified ? `<iconify-icon icon="material-symbols:verified" class="ig-verified"></iconify-icon>` : '';

                const postHTML = `
                <div class="ig-post">
                    <div class="ig-post-header">
                        <div class="ig-user-wrap">
                            <div class="ig-avatar-ring"><img src="${post.avatar}" alt="Avatar"></div>
                            <div class="ig-name-loc">
                                <div class="ig-name-row">
                                    <span class="ig-username">${post.username}</span>
                                    ${verifiedHTML}
                                </div>
                                ${post.location ? `<span class="ig-location">${post.location}</span>` : ''}
                            </div>
                        </div>
                        <iconify-icon icon="mdi:dots-vertical" class="ig-dots"></iconify-icon>
                    </div>
                    
                    ${mediaHTML}

                    <div class="ig-actions">
                        <div class="ig-actions-left">
                            <div class="ig-action-item" onclick="toggleLike(this)">
                                <iconify-icon icon="ph:heart" class="ig-icon like-icon"></iconify-icon>
                                <span class="ig-count">${post.likes}</span>
                            </div>
                            <div class="ig-action-item">
                                <iconify-icon icon="ph:chat-circle" class="ig-icon"></iconify-icon>
                                <span class="ig-count">${post.comments}</span>
                            </div>
                            <div class="ig-action-item">
                                <iconify-icon icon="ph:arrows-clockwise" class="ig-icon"></iconify-icon>
                                <span class="ig-count">${post.reposts}</span>
                            </div>
                            <div class="ig-action-item">
                                <iconify-icon icon="ph:paper-plane-tilt" class="ig-icon"></iconify-icon>
                                <span class="ig-count">${post.shares}</span>
                            </div>
                        </div>
                        <iconify-icon icon="ph:bookmark-simple" class="ig-icon" style="cursor:pointer;"></iconify-icon>
                    </div>

                    <div class="ig-caption-container">
                        <div class="ig-caption original-text"><strong>${post.username}</strong> ${post.captionOriginal}</div>
                        ${post.captionTranslated ? `<div class="ig-caption translated-text" style="display:none;"><strong>${post.username}</strong> ${post.captionTranslated}</div>` : ''}
                    </div>
                    ${post.captionTranslated ? `<div class="ig-translate-btn" onclick="toggleTranslation(this)">Lihat terjemahan</div>` : ''}
                    <div class="ig-time">${post.time}</div>
                </div>
                `;
                container.innerHTML += postHTML;
            });

            // Setel Logic Video Double Tap & Mute
            document.querySelectorAll('.video-media').forEach(container => {
                let clickTimer = null;
                const video = container.querySelector('video');
                const muteIndicator = container.querySelector('.mute-indicator');
                const muteIcon = muteIndicator.querySelector('iconify-icon');

                container.addEventListener('click', (e) => {
                    if(clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                        triggerDoubleTapLike(container);
                    } else {
                        clickTimer = setTimeout(() => {
                            video.muted = !video.muted; 
                            muteIcon.setAttribute('icon', video.muted ? 'ph:speaker-x' : 'ph:speaker-high');
                            muteIndicator.classList.add('show');
                            setTimeout(() => muteIndicator.classList.remove('show'), 1500);
                            clickTimer = null;
                        }, 250);
                    }
                });
                videoObserver.observe(video);
            });
        }

        // --- IG GALLERY INTERACTIVE LOGIC ---
        function toggleLike(wrapper) {
            const icon = wrapper.querySelector('.ig-icon');
            const isLiked = icon.getAttribute('icon') === 'ph:heart-fill';

            if(isLiked) {
                icon.setAttribute('icon', 'ph:heart'); 
                icon.classList.remove('liked');
            } else {
                icon.setAttribute('icon', 'ph:heart-fill'); 
                icon.classList.add('liked');
            }
        }

        function triggerDoubleTapLike(container) {
            const heart = container.querySelector('.double-tap-heart');
            const post = container.closest('.ig-post');
            const likeWrapper = post.querySelector('.ig-action-item'); 
            const likeIcon = likeWrapper.querySelector('.like-icon');
            
            heart.classList.remove('animate'); void heart.offsetWidth; heart.classList.add('animate');
            if(likeIcon.getAttribute('icon') !== 'ph:heart-fill') toggleLike(likeWrapper);
        }

        function toggleTranslation(btn) {
            const post = btn.closest('.ig-post');
            const originalText = post.querySelector('.original-text');
            const translatedText = post.querySelector('.translated-text');

            if (translatedText.style.display === 'none') {
                originalText.style.display = 'none';
                translatedText.style.display = 'block';
                btn.innerText = 'Lihat teks asli';
            } else {
                originalText.style.display = 'block';
                translatedText.style.display = 'none';
                btn.innerText = 'Lihat terjemahan';
            }
        }

        let currentSongIndex = 0;
        let isPlaying = false;
        let currentLyricIndex = -1;
        
        const audio = document.getElementById('realAudioPlayer');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const lyricDisplay = document.getElementById('currentLyric');

        function loadSong(index) {
            const song = playlist[index];
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('songArtist').innerText = song.artist;
            document.getElementById('coverImage').src = song.cover;
            audio.src = song.src;
            currentLyricIndex = -1;
            
            // Lirik kosong sepenuhnya saat lagu baru diputar / belum main
            lyricDisplay.innerHTML = "";
            lyricDisplay.style.opacity = 1;
            lyricDisplay.style.transform = "translateY(0)";
        }

        function togglePlay() {
            if(audio.paused) { audio.play(); playIcon.setAttribute('icon', 'mdi:pause'); isPlaying = true; } 
            else { audio.pause(); playIcon.setAttribute('icon', 'mdi:play'); isPlaying = false; }
        }

        function nextSong() { currentSongIndex = (currentSongIndex + 1) % playlist.length; loadSong(currentSongIndex); if(isPlaying) audio.play(); }
        function prevSong() { currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length; loadSong(currentSongIndex); if(isPlaying) audio.play(); }
        function formatTime(s) { if(isNaN(s)) return "0:00"; let min = Math.floor(s/60), sec = Math.floor(s%60); return `${min}:${sec<10?'0'+sec:sec}`; }

        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('totalDuration').innerText = formatTime(audio.duration);
            }
            const song = playlist[currentSongIndex];
            if(song.lyrics) {
                let activeIdx = -1;
                for(let i=0; i<song.lyrics.length; i++) {
                    if(audio.currentTime >= song.lyrics[i].time) activeIdx = i; else break;
                }
                if(activeIdx !== currentLyricIndex && activeIdx >= 0) {
                    currentLyricIndex = activeIdx;
                    lyricDisplay.style.opacity = 0;
                    lyricDisplay.style.transform = "translateY(5px)";
                    setTimeout(() => {
                        lyricDisplay.innerHTML = song.lyrics[activeIdx].text;
                        lyricDisplay.style.opacity = 1;
                        lyricDisplay.style.transform = "translateY(0)";
                    }, 300);
                }
            }
        });

        audio.addEventListener('loadedmetadata', () => { document.getElementById('totalDuration').innerText = formatTime(audio.duration); });
        audio.addEventListener('ended', () => {
            isPlaying = false; playIcon.setAttribute('icon', 'mdi:play'); audio.currentTime = 0; 
            progressFill.style.width = '0%'; document.getElementById('currentTime').innerText = '0:00';
            
            // Lirik dikosongkan setelah lagu habis
            lyricDisplay.innerHTML = ""; 
        });

        function seekSong(e) { audio.currentTime = (e.clientX - document.getElementById('progressBar').getBoundingClientRect().left) / document.getElementById('progressBar').offsetWidth * audio.duration; }

        // --- GAME LOGIC (SCORING & CONFETTI) ---
        let gameActive = false, score = 0, highScore = 0, gameLoop;
        let enemiesData = []; 
        const gameArea = document.getElementById('gameArea');
        const player = document.getElementById('player');
        
        let playerTargetX = 50;  let playerCurrentX = 50;
        let playerTargetY = 200; let playerCurrentY = 200;

        function shootConfetti(count) {
            const colors = ['#ff3b30', '#34c759', '#007aff', '#ffcc00', '#ff9500', '#af52de', '#fff'];
            for(let i=0; i<count; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = '50%'; conf.style.top = '50%';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                gameArea.appendChild(conf);

                let angle = Math.random() * Math.PI * 2;
                let velocity = 5 + Math.random() * 15;
                let tx = Math.cos(angle) * velocity * 20;
                let ty = Math.sin(angle) * velocity * 20 + 100;

                conf.animate([
                    { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: 1000 + Math.random()*800, easing: 'ease-out' }).onfinish = () => conf.remove();
            }
        }

        function movePlayer(e) { 
            if(!gameActive) return; const rect = gameArea.getBoundingClientRect(); 
            playerTargetX = Math.max(22.5, Math.min(e.clientX - rect.left, rect.width - 22.5));
            playerTargetY = Math.max(22.5, Math.min(e.clientY - rect.top, rect.height - 22.5)); 
        }
        function movePlayerTouch(e) { 
            if(!gameActive) return; e.preventDefault(); const rect = gameArea.getBoundingClientRect(); 
            playerTargetX = Math.max(22.5, Math.min(e.touches[0].clientX - rect.left, rect.width - 22.5));
            playerTargetY = Math.max(22.5, Math.min(e.touches[0].clientY - rect.top, rect.height - 22.5)); 
        }
        function spawnEnemy() {
            let el = document.createElement('div'); el.className = 'enemy'; gameArea.appendChild(el); 
            let startY = Math.random() * (gameArea.offsetHeight - 35);
            let startX = gameArea.offsetWidth + 10;
            el.style.transform = `translate(${startX}px, ${startY}px)`;
            enemiesData.push({ el: el, x: startX, y: startY, passed: false });
        }
        function updateGame() {
            if(!gameActive) return;
            if(Math.random() < 0.015 + (score * 0.0005)) spawnEnemy(); 
            playerCurrentX += (playerTargetX - playerCurrentX) * 0.15;
            playerCurrentY += (playerTargetY - playerCurrentY) * 0.15; 
            player.style.transform = `translate(${playerCurrentX - 22.5}px, ${playerCurrentY - 22.5}px)`; 
            let pLeft = playerCurrentX - 22.5, pRight = playerCurrentX + 22.5;
            let pTop = playerCurrentY - 22.5, pBottom = playerCurrentY + 22.5;

            for(let i=0; i<enemiesData.length; i++) {
                let enemy = enemiesData[i];
                enemy.x -= (3 + (score * 0.1)); 
                enemy.el.style.transform = `translate(${enemy.x}px, ${enemy.y}px)`;
                
                let eLeft = enemy.x, eRight = enemy.x + 35, eTop = enemy.y, eBottom = enemy.y + 35;
                if (pLeft < eRight && pRight > eLeft && pTop < eBottom && pBottom > eTop) return gameOver();
                
                if (!enemy.passed && eRight < pLeft) {
                    enemy.passed = true; score++; document.getElementById('gameScore').innerText = score;
                    if (score > 0 && score % 5 === 0) shootConfetti(30); 
                }
                if (enemy.x < -50) { enemy.el.remove(); enemiesData.splice(i, 1); i--; }
            }
            gameLoop = requestAnimationFrame(updateGame);
        }

        function startGame() { if(gameActive) return; gameActive = true; document.getElementById('startBtn').disabled = true; document.getElementById('pauseBtn').disabled = false; gameLoop = requestAnimationFrame(updateGame); }
        function pauseGame() { gameActive = false; cancelAnimationFrame(gameLoop); document.getElementById('startBtn').disabled = false; document.getElementById('pauseBtn').disabled = true; }
        
        function gameOver() { 
            gameActive = false; cancelAnimationFrame(gameLoop); 
            let message = 'Game Over! Skor Anda: ' + score;
            if(score > highScore && score > 0) { 
                highScore = score; document.getElementById('highScore').innerText = highScore; shootConfetti(100); 
                message = '🎉 REKOR BARU! Skor Anda: ' + score;
            } 
            setTimeout(() => { alert(message); resetGame(); }, 500);
        }
        
        function resetGame() { 
            gameActive = false; cancelAnimationFrame(gameLoop); score = 0; document.getElementById('gameScore').innerText = '0'; 
            enemiesData.forEach(e => e.el.remove()); enemiesData = []; 
            document.getElementById('startBtn').disabled = false; document.getElementById('pauseBtn').disabled = true; 
            
            let areaHeight = gameArea.offsetHeight;
            playerTargetX = 50; playerTargetY = areaHeight > 0 ? areaHeight / 2 : 200; 
            playerCurrentX = playerTargetX; playerCurrentY = playerTargetY;
            player.style.transform = `translate(${playerCurrentX - 22.5}px, ${playerCurrentY - 22.5}px)`;
        }
        
        // --- INITIALIZATION ---
        window.addEventListener('load', () => { 
            renderGallery(); 
            loadSong(currentSongIndex); 
            
            let areaHeight = document.getElementById('gameArea').offsetHeight;
            playerTargetX = 50; playerTargetY = areaHeight > 0 ? areaHeight / 2 : 200; 
            playerCurrentX = playerTargetX; playerCurrentY = playerTargetY; 
            player.style.transform = `translate(${playerCurrentX - 22.5}px, ${playerCurrentY - 22.5}px)`; 
        });
    </script>
